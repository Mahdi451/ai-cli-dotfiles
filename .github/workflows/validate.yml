name: Validate AI CLI dotfiles

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Repository doctor
        run: ./doctor.sh --repo-only

      - name: Smoke tests
        run: ./tests/smoke-test.sh

      - name: Whitespace check
        run: git diff --check
