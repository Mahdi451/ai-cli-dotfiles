<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#05070b"/><style>.t{font-family:Arial,sans-serif;fill:#f8fafc}.h{font-size:44px;font-weight:700}.m{font-size:23px;font-weight:700}.s{font-size:17px}.box{rx:18;ry:18;stroke-width:3}.c{fill:#062b22;stroke:#34d399}.b{fill:#111f46;stroke:#60a5fa}.n{fill:#111827;stroke:#9ca3af}.r{fill:#450a0a;stroke:#f87171}.g{fill:#0d2a18;stroke:#4ade80}.a{stroke:#e5e7eb;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e5e7eb"/></marker></defs><text x="70" y="70" class="t h">Parallel Mode with Git Worktrees</text><rect x="510" y="105" width="380" height="70" class="box n"/><text x="700" y="148" text-anchor="middle" class="t m">Large task → split plan</text><rect x="60" y="240" width="370" height="560" class="box c"/><text x="245" y="285" text-anchor="middle" class="t m">worktree A · Composer 2.5</text><text x="245" y="318" text-anchor="middle" class="t s">../project-composer</text><text x="245" y="390" text-anchor="middle" class="t m">Inspect</text><text x="245" y="490" text-anchor="middle" class="t m">Implement</text><text x="245" y="590" text-anchor="middle" class="t m">Commit to branch</text><rect x="515" y="240" width="370" height="560" class="box c"/><text x="700" y="285" text-anchor="middle" class="t m">worktree B · Grok 4.6 High</text><text x="700" y="318" text-anchor="middle" class="t s">../project-grok</text><text x="700" y="390" text-anchor="middle" class="t m">Inspect</text><text x="700" y="490" text-anchor="middle" class="t m">Implement</text><text x="700" y="590" text-anchor="middle" class="t m">Commit to branch</text><rect x="970" y="240" width="370" height="560" class="box b"/><text x="1155" y="285" text-anchor="middle" class="t m">worktree C · Integration</text><text x="1155" y="318" text-anchor="middle" class="t s">../project-integrate</text><text x="1155" y="390" text-anchor="middle" class="t m">Cherry-pick / Merge</text><text x="1155" y="490" text-anchor="middle" class="t m">Tests / Lint / Build</text><text x="1155" y="590" text-anchor="middle" class="t m">Terra High review</text><text x="1155" y="690" text-anchor="middle" class="t m">Done</text><path d="M430 600H970" class="a"/><path d="M885 600H970" class="a"/><rect x="70" y="835" width="600" height="110" class="box r"/><text x="370" y="875" text-anchor="middle" class="t m">Do NOT: edit the same file concurrently</text><text x="370" y="910" text-anchor="middle" class="t s">Composer + Grok both editing ./src/foo.ts = conflicts</text><rect x="730" y="835" width="600" height="110" class="box g"/><text x="1030" y="875" text-anchor="middle" class="t m">Do instead</text><text x="1030" y="910" text-anchor="middle" class="t s">separate branches · worktrees · ownership · integration</text></svg>