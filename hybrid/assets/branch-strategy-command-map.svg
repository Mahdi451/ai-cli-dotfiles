<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000"><rect width="1400" height="1000" fill="#05070b"/><style>.t{font-family:Arial,sans-serif;fill:#f8fafc}.h{font-size:44px;font-weight:700}.m{font-size:22px;font-weight:700}.s{font-size:17px}.box{rx:18;ry:18;stroke-width:3}.c{fill:#062b22;stroke:#34d399}.p{fill:#2d0b3d;stroke:#c084fc}.b{fill:#111f46;stroke:#60a5fa}.n{fill:#111827;stroke:#9ca3af}.a{stroke:#e5e7eb;stroke-width:4;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#e5e7eb"/></marker></defs><text x="70" y="70" class="t h">Branch Strategy and Command Map</text><text x="70" y="125" class="t m">1 · Safe rollout</text><rect x="70" y="155" width="220" height="95" class="box n"/><text x="180" y="195" text-anchor="middle" class="t m">main</text><text x="180" y="225" text-anchor="middle" class="t s">stable</text><rect x="340" y="155" width="300" height="95" class="box c"/><text x="490" y="195" text-anchor="middle" class="t m">hybrid-cursor-codex-v3</text><text x="490" y="225" text-anchor="middle" class="t s">experimental</text><rect x="690" y="155" width="180" height="95" class="box c"/><text x="780" y="210" text-anchor="middle" class="t m">test</text><rect x="920" y="155" width="180" height="95" class="box c"/><text x="1010" y="210" text-anchor="middle" class="t m">iterate</text><rect x="1150" y="155" width="180" height="95" class="box c"/><text x="1240" y="195" text-anchor="middle" class="t m">merge later</text><text x="1240" y="225" text-anchor="middle" class="t s">when proven</text><path d="M290 202H340" class="a"/><path d="M640 202H690" class="a"/><path d="M870 202H920" class="a"/><path d="M1100 202H1150" class="a"/><text x="70" y="325" class="t m">2 · Command map</text><rect x="70" y="355" width="600" height="340" class="box c"/><text x="370" y="400" text-anchor="middle" class="t m">Primary commands</text><text x="120" y="455" class="t m">hybrid</text><text x="260" y="455" class="t s">universal safe hierarchy</text><text x="120" y="510" class="t m">hyolo</text><text x="260" y="510" class="t s">universal autonomous hierarchy</text><text x="120" y="565" class="t m">groky</text><text x="260" y="565" class="t s">direct Cursor escape hatch</text><text x="120" y="620" class="t m">cyolo</text><text x="260" y="620" class="t s">direct Codex escape hatch</text><text x="120" y="675" class="t m">cdx</text><text x="260" y="675" class="t s">raw Codex</text><rect x="730" y="355" width="600" height="340" class="box p"/><text x="1030" y="400" text-anchor="middle" class="t m">Compatibility-only</text><text x="790" y="470" class="t m">cagent</text><text x="790" y="540" class="t m">cursory</text><text x="790" y="610" class="t m">codexy</text><text x="790" y="660" class="t s">kept for backward compatibility</text><rect x="110" y="770" width="1180" height="130" class="box n"/><text x="700" y="815" text-anchor="middle" class="t m">User → hybrid / hyolo → deterministic router → Composer or Grok</text><text x="700" y="855" text-anchor="middle" class="t m">→ validation → Terra review if warranted → Sol for architecture only</text><text x="700" y="940" text-anchor="middle" class="t s">Preserve old launchers · test before replacing · reduce duplicate model roles · distinct job per subscription</text></svg>